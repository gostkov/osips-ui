[tool.poetry]
name = "back-osips-ui"
version = "1.0.0"
description = "Backend for OpenSIPS management web UI"
authors = ["Evgeniy Gostkov <gostkov.evg@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.115.14"
uvicorn = "^0.32.0"
gunicorn = "^23.0.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = "^2.0.36"
aiosqlite = "^0.20.0"
aiomysql = "^0.2.0"
pymysql = "^1.1.1"
httpx = "^0.28.1"
pyjwt = "^2.10.0"
bcrypt = "^4.2.0"
cryptography = "^43.0.0"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"

[tool.black]
line-length = 140
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
