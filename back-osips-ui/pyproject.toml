[project]
name = "back-osips-ui"
version = "1.0.0"
description = "Backend for OpenSIPS management web UI"
authors = [{ name = "Evgeniy Gostkov", email = "gostkov.evg@gmail.com" }]
requires-python = ">=3.11,<3.15"

# Версии зафиксированы по минорной ветке (~=), точные версии - в poetry.lock.
# Обновление: poetry update <пакет> либо правка ограничения + poetry lock.
dependencies = [
    "fastapi~=0.115.14",
    "uvicorn~=0.52.4",
    "gunicorn~=23.0.0",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.15.0",
    "sqlalchemy~=2.0.52",
    "aiosqlite~=0.20.0",
    "aiomysql~=0.2.0",
    "pymysql~=1.2.0",
    "httpx~=0.28.1",
    "pyjwt~=2.13.0",
    "bcrypt~=5.0.0",
    "cryptography~=43.0.3",
    "python-multipart~=0.0.32",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "~8.4.2"
pytest-asyncio = "~1.4.0"
pytest-cov = "~6.0.0"

[tool.black]
line-length = 140
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
