[project]
name = "back-osips-ui"
version = "1.0.0"
description = "Backend for OpenSIPS management web UI"
authors = [{ name = "Evgeniy Gostkov", email = "gostkov.evg@gmail.com" }]
requires-python = ">=3.11,<3.15"

# Версии зафиксированы по минорной ветке (~=), точные версии - в poetry.lock.
# Обновление: poetry update <пакет> либо правка ограничения + poetry lock.
dependencies = [
    "fastapi~=0.162.4",
    # starlette тянется фастапи без верхней границы, но нам важен нижний порог:
    # в <0.49 DoS через заголовок Range в FileResponse (GHSA-7f5h-v6xp-fcq8), а им раздаётся SPA
    "starlette~=1.10.0",
    "uvicorn~=0.54.0",
    "uvicorn-worker~=0.4.0",
    "gunicorn~=26.2.0",
    "pydantic~=2.14.3",
    "pydantic-settings~=2.16.2",
    "sqlalchemy[asyncio]~=2.1.8",
    "aiosqlite~=0.22.1",
    "aiomysql~=0.3.2",
    "pymysql~=1.2.4",
    "httpx~=0.28.1",
    "pyjwt~=2.15.1",
    "bcrypt~=5.0.0",
    "cryptography~=50.0.2",
    "python-multipart~=0.0.33",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
httpx2 = "~2.16.0"
pytest = "~9.2.0"
pytest-asyncio = "~1.4.1.post1"
pytest-cov = "~7.1.0"

[tool.black]
line-length = 140
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
